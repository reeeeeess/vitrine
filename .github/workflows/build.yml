# Builds the Windows installer and the macOS disk images on every push to main and every tag.
# A tag vX.Y.Z (matching "version" in package.json) also publishes a GitHub release with both,
# which the Windows app's automatic updates read from.
# Optional repository secrets:
#   VITRINE_CLIENT_ID                Spotify Client ID built into the app (otherwise people enter their own)
#   EVS_ACCOUNT_NAME / EVS_PASSWD    castlabs EVS account, to sign Widevine VMP (needed for reliable playback)
name: Build

permissions:
  contents: write

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Fetch GitHub dependencies over HTTPS
        run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm run typecheck
      - run: npm test

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
    runs-on: ${{ matrix.os }}
    env:
      EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch GitHub dependencies over HTTPS
        run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/
      - run: npm ci
      - name: Sign in to castlabs EVS
        if: ${{ env.EVS_ACCOUNT_NAME != '' }}
        env:
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
        run: |
          python -m pip install --upgrade castlabs-evs
          python -m castlabs_evs.account reauth -A "$EVS_ACCOUNT_NAME" -P "$EVS_PASSWD"
        shell: bash
      # on a version tag, the Windows build publishes the release (installer + latest.yml for updates)
      - run: npm run dist:${{ matrix.target }} -- --publish ${{ matrix.target == 'win' && startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          VITRINE_CLIENT_ID: ${{ secrets.VITRINE_CLIENT_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: vitrine-${{ matrix.target }}
          path: |
            release/*.exe
            release/*.dmg
            release/latest.yml
          if-no-files-found: error

  release:
    # adds the macOS disk images to the release the Windows build published
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vitrine-mac
          path: mac
      - run: gh release upload "$GITHUB_REF_NAME" mac/*.dmg --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
