# Builds the Windows installer, the macOS disk images and the Linux AppImage on every push to main and every tag.
# A tag vX.Y.Z (matching "version" in package.json) also publishes a GitHub release with all of them,
# which the automatic updates (Windows, AppImage) read from.
# Optional repository secrets:
#   VITRINE_CLIENT_ID                Spotify Client ID built into the app (otherwise people enter their own)
#   EVS_ACCOUNT_NAME / EVS_PASSWD    castlabs EVS account, to sign Widevine VMP (needed for reliable playback)
name: Build

permissions:
  contents: write

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # a tag on code of another version would publish under that other version's name
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Le tag $GITHUB_REF_NAME est posé sur du code en version $version. Envoyez d'abord le code de $GITHUB_REF_NAME (git push origin main), supprimez le tag puis recréez-le."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Fetch GitHub dependencies over HTTPS
        run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm run typecheck
      - run: npm test
      # the built page in a real Chromium, desktop bridge and Spotify made up (tests/e2e/smoke.mjs)
      - run: npm run build:renderer
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    env:
      EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch GitHub dependencies over HTTPS
        run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/
      - run: npm ci
      - name: Sign in to castlabs EVS
        if: ${{ env.EVS_ACCOUNT_NAME != '' }}
        env:
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
        run: |
          python -m pip install --upgrade castlabs-evs
          python -m castlabs_evs.account reauth -A "$EVS_ACCOUNT_NAME" -P "$EVS_PASSWD"
        shell: bash
      # on a version tag, the Windows build publishes the release (installer + latest.yml for updates)
      - run: npm run dist:${{ matrix.target }} -- --publish ${{ matrix.target == 'win' && startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          VITRINE_CLIENT_ID: ${{ secrets.VITRINE_CLIENT_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: vitrine-${{ matrix.target }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/latest.yml
            release/latest-linux.yml
          if-no-files-found: error

  release:
    # adds the macOS disk images and the AppImage to the release the Windows build published
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vitrine-mac
          path: mac
      - uses: actions/download-artifact@v4
        with:
          name: vitrine-linux
          path: linux
      # the release normally exists already (the Windows build creates it); created here otherwise
      - run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Vitrine ${GITHUB_REF_NAME#v}" --generate-notes
          gh release upload "$GITHUB_REF_NAME" mac/*.dmg linux/*.AppImage linux/latest-linux.yml --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
