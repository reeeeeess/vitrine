# Builds the Windows installer and the macOS disk images on every push to main and every tag.
# Optional repository secrets:
#   VITRINE_CLIENT_ID                Spotify Client ID built into the app (otherwise people enter their own)
#   EVS_ACCOUNT_NAME / EVS_PASSWD    castlabs EVS account, to sign Widevine VMP (needed for reliable playback)
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Fetch GitHub dependencies over HTTPS
        run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm run typecheck
      - run: npm test

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
    runs-on: ${{ matrix.os }}
    env:
      EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch GitHub dependencies over HTTPS
        run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/
      - run: npm ci
      - name: Sign in to castlabs EVS
        if: ${{ env.EVS_ACCOUNT_NAME != '' }}
        env:
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
        run: |
          python -m pip install --upgrade castlabs-evs
          python -m castlabs_evs.account reauth -A "$EVS_ACCOUNT_NAME" -P "$EVS_PASSWD"
        shell: bash
      - run: npm run dist:${{ matrix.target }} -- --publish never
        env:
          VITRINE_CLIENT_ID: ${{ secrets.VITRINE_CLIENT_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: vitrine-${{ matrix.target }}
          path: |
            release/*.exe
            release/*.dmg
          if-no-files-found: error
